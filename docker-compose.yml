services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poster_studio}
      POSTGRES_USER: ${POSTGRES_USER:-poster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poster}
    ports:
      - "5432:5432"
    volumes:
      - poster_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poster} -d ${POSTGRES_DB:-poster_studio}"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-poster}:${POSTGRES_PASSWORD:-poster}@db:5432/${POSTGRES_DB:-poster_studio}
      FRONTEND_ORIGIN: http://localhost:5173
      RENDERER_URL: http://renderer:8001
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      renderer:
        condition: service_healthy

  renderer:
    build: ./renderer
    working_dir: /app
    ports:
      - "8001:8001"
    volumes:
      - ./renderer:/app
      - renderer_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api

volumes:
  poster_db_data:
  frontend_node_modules:
  renderer_node_modules:
